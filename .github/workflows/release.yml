name: Release Scaffild

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Extract Release Notes from CHANGELOG.md
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $content = Get-Content -Raw CHANGELOG.md
          $pattern = "(?s)## \[$tag\][^\n]*\n(.*?)(?=\n## \[|\Z)"
          if ($content -match $pattern) {
              $notes = $matches[1].Trim()
          } else {
              $notes = "Release $tag - See CHANGELOG.md for details."
          }
          $body = @"
          ## What's in this release:
          
          $notes
          
          ---
          ### 📦 Download & Installation:
          - **Setup Wizard (\`.exe\`)**: Recommended installer with Desktop and Start Menu shortcuts.
          - **MSI Package (\`.msi\`)**: Enterprise installer for silent and automated deployments.
          "@
          [System.IO.File]::WriteAllText("RELEASE_BODY.md", $body, [System.Text.Encoding]::UTF8)

      - name: Build Tauri App & Package Installers (MSI, NSIS, EXE)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Scaffild ${{ github.ref_name }}'
          bodyFile: 'RELEASE_BODY.md'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
